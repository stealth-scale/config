name: Feature request
description: Propose a capability a package does not have.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        A change that alters a published interface, or that has competing approaches worth
        comparing, is written as an RFC under `docs/rfc/` rather than settled in an issue. Open
        this to agree the problem first.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: The package the capability belongs to, or a new one.
      options:
        - "@stealthscale/theme"
        - "@stealthscale/vite-config"
        - "@stealthscale/vite-config-core"
        - "@stealthscale/vite-config-css"
        - "@stealthscale/vite-config-plain"
        - "@stealthscale/vite-config-react"
        - "@stealthscale/vite-config-theme"
        - "@stealthscale/vite-config-typescript"
        - "@stealthscale/vite-plugin-base"
        - "@stealthscale/vite-plugin-sbom"
        - "@stealthscale/vite-plugin-theme"
        - "@stealthscale/pandacss-naming"
        - "@stealthscale/pandacss-compiler"
        - "@stealthscale/testing"
        - "@stealthscale/testing-config"
        - "@stealthscale/testing-react"
        - "@stealthscale/testing-theme"
        - A package that does not exist yet
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where the packages stopped you.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: >
        The workaround you have, and what it costs. A problem with no workaround is worth saying so
        plainly.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: The shape you have in mind
      description: >
        The call, the layer or the token as you would write it, where you have one. Leave it empty
        rather than guess.
      render: ts
    validations:
      required: false
