# What `pnpm run ready` runs, on every pull request of this repository and in every stealth
# repository that calls this file: the same command a developer runs, and nothing this file
# adds on top of it. A repository whose tests open a browser installs one in a step of its
# own, because none here do.
#
# A push to main does not run this directly. `release` owns that branch, calls this file
# first, and publishes only what it proved.
name: ci

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm run ready
