# The install policy. Versions themselves are declared once in the root
# package.json's catalog; this file is the rules around fetching them.

[install]
# Nothing published in the last day is installed. Every npm compromise of the
# last few years — event-stream, ua-parser-js, the 2025 worm — was found and
# yanked within days, so waiting removes most of that class of attack at the
# cost of never being first to a release.
#
# A day rather than longer because that is what pnpm settled on as its own
# default after looking at the same attacks, and because the cost of a wider
# window is paid every time a dependency is deliberately added: bun fails the
# whole install rather than falling back to the newest version that clears the
# window, and it has no per-package exemption.
#
# `bun install --frozen-lockfile`, which is what CI runs, resolves nothing and
# is unaffected. The policy only applies when a dependency is added or moved,
# which is exactly when it should.
#
# A package still inside the window is either waited out, pinned in the catalog
# to the newest version that clears it, or — last resort, and it lifts the
# policy for everything that install resolves, not just the one package:
#
#     bun install --minimum-release-age=0
#
# Note that bun reports a package held back by this policy as "not in the
# catalog", which is not what is wrong with it.
minimumReleaseAge = 86_400
