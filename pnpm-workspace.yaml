packages:
  - examples/*
  - packages/*

catalogMode: prefer

# What a workspace resolves `vite` to. Vite+ ships the toolchain under its own name and is
# installed here in place of Vite, which is why this is an alias rather than a range.
catalog:
  "@arethetypeswrong/core": ^0.18.5
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.2
  "@cyclonedx/cyclonedx-library": ^10.2.0
  "@module-federation/runtime": 2.9.0
  "@module-federation/vite": 1.21.5
  "@tanstack/react-router": 1.170.34
  "@testing-library/react": ^16.3.0
  "@types/node": ^26.5.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/spdx-expression-parse": ^4.0.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11
  "@commitlint/cli": ^21.2.2
  "@vitest/eslint-plugin": ^1.6.27
  eslint-plugin-jsdoc: ^64.3.10
  eslint-plugin-perfectionist: ^5.11.0
  eslint-plugin-tsdoc: ^0.5.2
  happy-dom: ^20.14.3
  lefthook: ^2.1.12
  oxc-transform-react: ^0.149.0
  packageurl-js: ^2.0.1
  publint: ^0.3.24
  react: ^19.3.0
  react-dom: ^19.3.0
  spdx-expression-parse: ^5.0.0
  stylelint: ^17.15.0
  stylelint-config-standard: ^40.0.0
  stylelint-high-performance-animation: ^2.0.0
  stylelint-order: ^8.1.1
  stylelint-use-nesting: ^6.0.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plugin-stylelint: ^6.3.0
  vite-plus: 0.3.1
  vitest: 4.1.11
  yaml: ^2.9.1

# What a published package asks a consumer for. Separate from the default catalog because that
# one aliases `vite` to Vite+ and pins `vite-plus` exactly, and a package manager writes a catalog
# entry into the published manifest verbatim: peering on the default would tell a consumer to
# install Vite+ under the name `vite`, and to install one exact Vite+ version.
catalogs:
  peer:
    vite: ^8.0.0
    vite-plus: ^0.3.1
    vitest: ^4.0.0

overrides:
  vite@*: "catalog:"

# `vite` here is Vite+ under an alias, so its version reads as 0.3.1 and every package asking for
# a real Vite range reports an unmet peer. The range they ask for is satisfied; the number they
# read is not the one they are checking against.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Three days, in minutes. A version published more recently than this is not installed unless it
# is listed below, which is the answer to a package taken over between one release and the next.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - yaml@2.9.1
# lefthook's postinstall installs the hooks, which the `prepare` script already does by name. A
# dependency that runs no script at install time is one fewer thing to audit, and `prepare` fails
# visibly where a postinstall swallows its own error.
allowBuilds:
  lefthook: false
